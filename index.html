<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mad geeked</title>
<meta name="description" content="mad geeked">
<meta name="theme-color" content="#0c0a14">
<meta property="og:title" content="mad geeked">
<meta property="og:image" content="assets/chanceify.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root {
    --bg: #0c0a14;
    --panel: #15121f;
    --line: #272238;
    --text: #f1eefa;
    --dim: #9a94b0;
    --mint: #3eeaa4;
    --pink: #f25ca2;
    --honey: #ffc247;
    --display: "Segoe UI Variable Display", "Segoe UI", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

  header { display: flex; align-items: center; gap: 22px; padding: 64px 0 28px; }
  header img { width: clamp(56px, 11vw, 92px); height: auto; flex: none; }
  h1 { font: 800 clamp(44px, 11vw, 104px)/.92 var(--display); letter-spacing: -.045em; margin: 0; }

  /* Flow: sheets of colour folded over each other, drawn like chanceify's visualizer. */
  .flow { display: block; width: 100%; height: clamp(150px, 26vw, 230px); }

  section { padding: 40px 0 8px; }
  .project { display: grid; gap: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; align-items: center; }
  .project .head { display: flex; align-items: center; gap: 18px; }
  .project .head img { width: 72px; height: 72px; flex: none; }
  .project h2 { font: 800 34px/1.05 var(--display); letter-spacing: -.03em; margin: 0; }
  .project .tag { margin: 4px 0 0; font-weight: 650; background: linear-gradient(90deg, var(--mint), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .facts { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; color: var(--dim); font-size: 16px; }
  .facts li::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); margin-right: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn { display: inline-block; text-decoration: none; font-weight: 650; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); transition: border-color .15s, filter .15s; }
  .btn:hover { border-color: var(--mint); }
  .btn.primary { background: var(--mint); color: #08150f; border-color: var(--mint); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.honey { border-color: var(--honey); color: var(--honey); }
  .btn.honey:hover { background: rgba(255,194,71,.12); }

  .more { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 36px 0 64px; }
  .socials { display: flex; flex-wrap: wrap; gap: 18px; }
  .socials a { color: var(--dim); text-decoration: none; }
  .socials a:hover { color: var(--text); }

  @media (min-width: 720px) { .project { grid-template-columns: 1.3fr 1fr; padding: 34px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="" hidden>
    <h1 id="name">mad geeked</h1>
  </header>
</div>
<canvas class="flow" id="flow" aria-hidden="true"></canvas>
<div class="wrap">
  <main>
    <div id="projects"></div>
    <div class="more">
      <a class="btn honey" id="coffee" hidden></a>
      <nav class="socials" id="socials" aria-label="links"></nav>
    </div>
  </main>
</div>
<script>
/* Content comes from projects.json: edit that file, never this one. */
(function () {
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { n[k] = props[k]; });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function render(d) {
    if (d.name) { document.getElementById("name").textContent = d.name; document.title = d.name; }
    if (d.logo) { var l = document.getElementById("logo"); l.src = d.logo; l.hidden = false; }
    var box = document.getElementById("projects");
    (d.projects || []).filter(function (p) { return p.public; }).forEach(function (p) {
      var head = el("div", { className: "head" }, []);
      if (p.logo) head.appendChild(el("img", { src: p.logo, alt: "", width: 72, height: 72 }));
      var t = el("div", {}, [el("h2", { textContent: p.name })]);
      if (p.tagline) t.appendChild(el("p", { className: "tag", textContent: p.tagline }));
      head.appendChild(t);
      var left = el("div", {}, [head]);
      var actions = el("div", { className: "actions" }, []);
      (p.links || []).forEach(function (a) {
        actions.appendChild(el("a", { className: "btn" + (a.primary ? " primary" : ""), href: a.url, textContent: a.label }));
      });
      left.appendChild(actions);
      var facts = el("ul", { className: "facts" }, (p.facts || []).map(function (f) { return el("li", { textContent: f }); }));
      box.appendChild(el("section", {}, [el("article", { className: "project" }, [left, facts])]));
    });
    if (d.coffee && d.coffee.url) {
      var c = document.getElementById("coffee");
      c.href = d.coffee.url;
      c.textContent = d.coffee.label + (d.coffee.emoji ? " " + d.coffee.emoji : "");
      c.hidden = false;
    }
    var s = document.getElementById("socials");
    (d.socials || []).filter(function (x) { return x.public; }).forEach(function (x) {
      s.appendChild(el("a", { href: x.url, textContent: x.name }));
    });
  }
  fetch("projects.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(render).catch(function () {});
})();

/* Flow, ported from chanceify's player-bar visualizer: five sheets of colour, each riding on a
   spectrum and swinging slowly, folded over one another and faded toward the foot. */
(function () {
  var cv = document.getElementById("flow");
  var ctx = cv.getContext("2d");
  var layer = document.createElement("canvas");
  var lx = layer.getContext("2d");
  var POINTS = 96, SHEETS = 5, DEPTH = 0.75, OFFSET = 0.06, SWING = 0.34, DRIFT = 0.13;
  var LOW = "62,234,164", HIGH = "242,92,162";
  var W = 0, H = 0, dpr = 1;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = layer.width = Math.round(W * dpr);
    cv.height = layer.height = Math.round(H * dpr);
  }
  function levels(t) {
    var out = new Array(POINTS);
    var beat = 0.55 + 0.45 * Math.pow(Math.max(0, Math.sin(t * 3.1)), 2);
    for (var i = 0; i < POINTS; i++) {
      var x = i / (POINTS - 1);
      var env = 0.3 + 0.7 * Math.pow(1 - x, 1.3);
      var n = 0.5 + 0.5 * Math.sin(x * 19 + t * 2.3) * Math.cos(x * 7 - t * 1.1);
      var v = env * (0.3 + 0.7 * n) * (0.65 + 0.35 * beat * (1 - x * 0.6));
      out[i] = Math.max(0, Math.min(1, v));
    }
    return out;
  }
  function draw(t) {
    var lv = levels(t), phase = t * DRIFT;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var bass = 0, k = Math.floor(POINTS / 8);
    for (var b = 0; b < k; b++) bass += lv[b];
    bass /= k;
    var g = ctx.createLinearGradient(0, H / 2, 0, H);
    g.addColorStop(0, "rgba(" + LOW + ",0)");
    g.addColorStop(1, "rgba(" + LOW + "," + (0.5 * 0.6 * (0.4 + bass * bass)).toFixed(3) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, H / 2, W, H / 2);
    for (var s = 0; s < SHEETS; s++) {
      var back = s / Math.max(SHEETS - 1, 1);
      var dir = s % 2 === 0 ? 1 : -1;
      var swing = (phase * Math.PI * 2 + back * 1.7) * dir;
      var rest = H - H * (0.04 + back * DEPTH * 0.62);
      var reach = H * DEPTH * (0.72 - back * 0.3);
      var alpha = Math.max(0.5 - back * 0.3, 0.08) * 1.5;
      var shift = Math.round(s * OFFSET * POINTS) % POINTS;
      var top = H;
      lx.setTransform(1, 0, 0, 1, 0, 0);
      lx.clearRect(0, 0, layer.width, layer.height);
      lx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lx.globalCompositeOperation = "source-over";
      lx.beginPath();
      lx.moveTo(0, H);
      for (var i = 0; i < POINTS; i++) {
        var across = i / (POINTS - 1);
        var wave = Math.sin(across * Math.PI * 2 * 1.3 + swing);
        var y = rest - lv[(i + shift) % POINTS] * reach * (0.75 + 0.25 * wave) - wave * H * SWING * 0.28;
        if (y < top) top = y;
        lx.lineTo(across * W, y);
      }
      lx.lineTo(W, H); lx.closePath();
      var hg = lx.createLinearGradient(0, 0, W, 0);
      hg.addColorStop(0, "rgb(" + LOW + ")"); hg.addColorStop(1, "rgb(" + HIGH + ")");
      lx.fillStyle = hg; lx.fill();
      lx.globalCompositeOperation = "destination-in";
      var vg = lx.createLinearGradient(0, top, 0, H);
      vg.addColorStop(0, "rgba(0,0,0,1)"); vg.addColorStop(1, "rgba(0,0,0,0)");
      lx.fillStyle = vg; lx.fillRect(0, 0, W, H);
      ctx.globalAlpha = Math.min(alpha, 1);
      ctx.drawImage(layer, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t0 = performance.now();
  function frame(now) { draw((now - t0) / 1000 + 3); if (!still) requestAnimationFrame(frame); }
  size();
  window.addEventListener("resize", function () { size(); if (still) draw(3); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
